[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowweave-phase-one"
version = "0.1.0"
description = "Evidence and constrained-editing foundations for ShadowWeaveAI"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "psycopg[binary]", "alembic", "pydantic", "argon2-cffi", "PyJWT", "python-multipart", "jsonschema"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "imageio-ffmpeg", "pillow", "ruff"]

[tool.setuptools.packages.find]
where = ["services/api/src", "services/worker/src", "packages/contracts/src", "packages/ai/src", "packages/media/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
